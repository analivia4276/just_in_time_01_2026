<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just in Time - Principal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container topo">
            <div>
                <h1>Just in Time</h1>
                <p>Bem-vindo, <strong id="nome-usuario">Usuário</strong></p>
            </div>

            <button id="btn-sair" class="btn-sair">
                Sair
            </button>
        </div>
    </header>

    <main class="container">

        <h2>Menu principal</h2>

        <div class="menu">

            <a href="produtos.html" class="card-menu">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1538688525198-9b88f6f53126?auto=format&fit=crop&w=800&q=80');"></div>
                <div class="card-info">
                    <h3>Cadastro de Produtos</h3>
                    <p>Gerencie o catálogo de chapas, fitas de bordo e acabamentos</p>
                </div>
            </a>

            <a href="producao.html" class="card-menu">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80');"></div>
                <div class="card-info">
                    <h3>Gestão da Produção</h3>
                    <p>Controle de movimentações, serras e estoque atual</p>
                </div>
            </a>

        </div>

    </main>

    <script src="js/principal.js"></script>

</body>

</html>

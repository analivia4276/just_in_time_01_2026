<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just in Time - Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container topo">
            <div>
                <h1>Cadastro de Produtos</h1>
                <p>Gerenciamento dos produtos</p>
            </div>

            <button id="btn-sair" class="btn-sair">
                Sair
            </button>
        </div>
    </header>

    <main class="container">

        <div class="acoes-form">
            <button
                class="btn-secundario"
                onclick="window.location.href='principal.html'">
                Voltar
            </button>
        </div>

        <section class="formulario">

            <h2 id="titulo-formulario">
                Cadastrar produto
            </h2>

            <form id="form-produto">

                <div class="grid-form">

                    <div class="campo">
                        <label for="nome">Nome</label>

                        <input
                            type="text"
                            id="nome"
                            required>
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>

                        <input
                            type="text"
                            id="descricao"
                            required>
                    </div>

                    <div class="campo">
                        <label for="custo">Custo</label>

                        <input
                            type="number"
                            id="custo"
                            step="0.01"
                            min="0"
                            required>
                    </div>

                    <div class="campo">
                        <label for="quantidade_estoque">
                            Quantidade em estoque
                        </label>

                        <input
                            type="number"
                            id="quantidade_estoque"
                            min="0"
                            required>
                    </div>

                    <div class="campo">
                        <label for="estoque_minimo">
                            Estoque mínimo
                        </label>

                        <input
                            type="number"
                            id="estoque_minimo"
                            min="0"
                            required>
                    </div>

                </div>

                <div class="acoes-form">

                    <button
                        type="submit"
                        class="btn-principal"
                        id="btn-salvar">
                        Cadastrar
                    </button>

                    <button
                        type="button"
                        class="btn-secundario"
                        id="btn-cancelar"
                        style="display: none;">
                        Cancelar edição
                    </button>

                </div>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>

        <section class="tabela-container">

            <div class="topo">
                <h2>Produtos cadastrados</h2>

                <div>
                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar produto..."
                        style="padding: 10px;">
                </div>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Custo</th>
                        <th>Estoque</th>
                        <th>Estoque mínimo</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-produtos">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/produtos.js"></script>

</body>

</html>

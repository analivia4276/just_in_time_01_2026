<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just in Time - Produção</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container topo">
            <div>
                <h1>Gestão da Produção</h1>
                <p>Controle de movimentação e estoque</p>
            </div>

            <button id="btn-sair" class="btn-sair">
                Sair
            </button>
        </div>
    </header>

    <main class="container">

        <div class="acoes-form">
            <button
                class="btn-secundario"
                onclick="window.location.href='principal.html'">
                Voltar
            </button>
        </div>

        <section class="formulario">

            <h2>Registrar movimentação</h2>

            <form id="form-producao">

                <div class="grid-form">

                    <div class="campo">
                        <label for="produto">
                            Produto
                        </label>

                        <select id="produto" required>

                            <option value="">
                                Selecione um produto
                            </option>

                        </select>
                    </div>

                    <div class="campo">
                        <label for="tipo">
                            Tipo de movimentação
                        </label>

                        <select id="tipo" required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="fabricado">
                                Fabricado
                            </option>

                            <option value="pedido">
                                Pedido
                            </option>

                        </select>
                    </div>

                    <div class="campo">
                        <label for="quantidade">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidade"
                            min="1"
                            required>
                    </div>

                    <div class="campo">
                        <label for="data_movimentacao">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data_movimentacao"
                            required>
                    </div>

                </div>

                <div class="acoes-form">

                    <button
                        type="submit"
                        class="btn-principal">
                        Registrar
                    </button>

                </div>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>

        <section class="tabela-container">

            <h2>Produtos e estoque atual</h2>

            <table>

                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Estoque atual</th>
                        <th>Estoque mínimo</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="lista-produtos">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/producao.js"></script>

</body>

</html>
